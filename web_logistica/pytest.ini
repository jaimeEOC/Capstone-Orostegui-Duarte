[tool:pytest]
# Configuración de pytest para Django
DJANGO_SETTINGS_MODULE = logistica_hr.settings_sqlite
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=logistica_hr
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
testpaths = tests
markers =
    unit: Pruebas unitarias
    integration: Pruebas de integración
    e2e: Pruebas end-to-end
    slow: Pruebas que tardan más tiempo
    api: Pruebas de API
    models: Pruebas de modelos
    views: Pruebas de vistas
    middleware: Pruebas de middleware
