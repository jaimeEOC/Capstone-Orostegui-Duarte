[tool:pytest]
DJANGO_SETTINGS_MODULE = logistica_hr.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --strict-markers --disable-warnings
markers =
    django_db: marks tests as requiring database access
    views: marks tests for views
    models: marks tests for models
    forms: marks tests for forms
    middleware: marks tests for middleware
    business_logic: marks tests for business logic calculations
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
testpaths = tests
