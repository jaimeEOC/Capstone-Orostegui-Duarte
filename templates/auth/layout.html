<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Logistica HR - Acceso{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary-color:#2c3e50; --secondary-color:#3498db; }
    body { background: linear-gradient(135deg,#eef5ff,#ffffff); min-height:100vh; }
    .auth-card { border:0; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,.08); }
    .auth-card .card-header {
      border-top-left-radius:16px; border-top-right-radius:16px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color:#fff;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="container py-5">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
