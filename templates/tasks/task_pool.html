{% extends 'auth/layout.html' %}
{% block content %}
<h2>Pool de tareas</h2>
<table class="table">
  <thead><tr><th>Título</th><th>Prioridad</th><th>Vence</th><th></th></tr></thead>
  <tbody>
  {% for t in tasks %}
    <tr>
      <td>{{ t.title }}</td>
      <td>{{ t.get_priority_display }}</td>
      <td>{{ t.due_date|date:"Y-m-d H:i" }}</td>
      <td><a class="btn btn-primary btn-sm" href="{% url 'tasks:assign_from_pool' t.id %}">Asignar</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="4">Sin tareas en pool.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
