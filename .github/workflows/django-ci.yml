name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: [3.9, 3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('web_logistica/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      working-directory: web_logistica
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-windows-simple.txt

    - name: Create logs directory
      working-directory: web_logistica
      run: mkdir -p logs

    - name: Run Database Migrations
      working-directory: web_logistica
      env:
        DJANGO_SETTINGS_MODULE: logistica_hr.settings.development
      run: python manage.py migrate

    - name: Run Tests
      working-directory: web_logistica
      env:
        DJANGO_SETTINGS_MODULE: logistica_hr.settings.development
      run: python manage.py test --verbosity=2

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run basic linting
      working-directory: web_logistica
      run: |
        echo "Running basic code quality checks..."
        # Solo verificar errores críticos
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120 --exclude=migrations,venv,__pycache__ || echo "Flake8 found issues but continuing..."
        echo "Linting completed"
